# Builds and tests Atlas on x64 and on ARM64, builds the Windows downloads, and installs, updates and uninstalls them
# on a computer of each architecture. The downloads of a release are the ones this workflow built and tested.
name: CI

on:
  push:
    branches: [main, 'release-*']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'

defaults:
  run:
    shell: pwsh

jobs:
  test:
    name: Build and test (${{ matrix.architecture }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            runner: windows-2025
          - architecture: ARM64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Processor
        run: |
          Write-Host "Windows reports $env:PROCESSOR_ARCHITECTURE"
          dotnet --info | Select-String 'RID|Architecture'
      - name: Build
        run: dotnet build Atlas.slnx --configuration Release
      - name: Test
        run: dotnet test --solution Atlas.slnx --configuration Release --no-build

  package:
    name: Build the downloads
    needs: test
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
      - name: Install Inno Setup 6.7.4
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.4.exe'
          Invoke-WebRequest -Uri 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe' -OutFile $installer
          $hash = (Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash
          if ($hash -ne 'A549929319F9120716677C685535CA4671E4B937B5FDC87E2585F32D8EB30E8C') { throw "Unexpected Inno Setup installer: $hash" }
          Start-Process -FilePath $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', '/SP-' -Wait
          $iscc = Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $iscc)) { throw 'ISCC.exe was not installed.' }
          "ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installers and the portable archives
        run: ./build/publish.ps1
      - name: Build older installers, to test updates
        run: |
          foreach ($architecture in 'x64', 'arm64') {
            $label = if ($architecture -eq 'arm64') { 'ARM64' } else { 'x64' }
            & $env:ISCC /Qp /DAppVersion=0.0.1-ci /DVersionMajor=0 /DVersionMinor=0 /DVersionPatch=1 "/DArch=$architecture" `
              "/DSourceDir=$PWD\artifacts\publish\win-$architecture" "/DOutputDir=$PWD\older" "/DOutputName=Atlas-Setup-$label-older" build\installer\Atlas.iss
            if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed with exit code $LASTEXITCODE." }
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: atlas-downloads
          path: |
            artifacts/Atlas-Setup-*.exe
            artifacts/Atlas-Portable-*.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: older-installers
          path: older/*.exe
          if-no-files-found: error

  install:
    name: Install, update and uninstall (${{ matrix.architecture }})
    needs: package
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: x64
            other: ARM64
            runner: windows-2025
          - architecture: ARM64
            other: x64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: atlas-downloads
          path: downloads
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: older-installers
          path: older
      - name: Checksums
        run: |
          foreach ($line in Get-Content downloads/SHA256SUMS.txt) {
            $hash, $file = $line -split '  ', 2
            $actual = (Get-FileHash -LiteralPath "downloads/$file" -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $hash) { throw "$file does not match its checksum." }
            Write-Host "ok  $file"
          }
      - name: Portable archive
        run: ./build/test-portable.ps1 -Archive downloads/Atlas-Portable-${{ matrix.architecture }}.zip
      - name: Install for all users, update, uninstall
        run: ./build/test-installer.ps1 -Installer downloads/Atlas-Setup-${{ matrix.architecture }}.exe -Scope AllUsers -OlderInstaller older/Atlas-Setup-${{ matrix.architecture }}-older.exe
      - name: Install for the current user, update, uninstall
        run: ./build/test-installer.ps1 -Installer downloads/Atlas-Setup-${{ matrix.architecture }}.exe -Scope CurrentUser
      - name: The installer of the other architecture refuses to install
        run: ./build/test-installer.ps1 -Installer downloads/Atlas-Setup-${{ matrix.other }}.exe -ExpectRefusal
